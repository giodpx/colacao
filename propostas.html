    let currentEmpresaId = "inspirar_fotografia";

    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const paramEmpresa = urlParams.get('empresa');
      if (paramEmpresa && propostasDb.some(p => p.id === paramEmpresa)) {
        currentEmpresaId = paramEmpresa;
      }

      renderSidebar();
      renderPropostaAtiva();
      lucide.createIcons();
    });

    function selectEmpresa(id) {
      currentEmpresaId = id;
      const newUrl = `${window.location.pathname}?empresa=${id}`;
      window.history.pushState({ path: newUrl }, '', newUrl);

      renderSidebar();
      renderPropostaAtiva();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      lucide.createIcons();
    }

    function renderSidebar() {
      const container = document.getElementById('navEmpresasContainer');
      if (!container) return;

      container.innerHTML = propostasDb.map(p => {
        const isActive = p.id === currentEmpresaId;
        
        let iconName = 'camera';
        if (p.categoria === 'cerimonial' || p.categoria === 'decoracao') {
          iconName = 'star';
        } else if (p.categoria === 'baile') {
          iconName = 'glass-water';
        }

        return `
          <button 
            onclick="selectEmpresa('${p.id}')" 
            title="${escapeHtml(p.nome)} (${escapeHtml(p.segmento)})" 
            class="group relative flex items-center md:flex-col justify-center gap-1.5 md:gap-1 px-3 py-1.5 md:p-2 rounded-xl transition-all shrink-0 ${
              isActive 
                ? 'bg-univasf-700 text-white shadow-md shadow-univasf-700/20' 
                : 'bg-slate-100/90 hover:bg-slate-200 text-slate-700 hover:text-slate-900'
            } md:w-16 md:h-16"
          >
            ${isActive ? `<span class="hidden md:block absolute -left-2 top-2 bottom-2 w-1 rounded-r-full bg-univasf-600"></span>` : ''}
            <i data-lucide="${iconName}" class="w-4 h-4 shrink-0 ${isActive ? 'text-white' : 'text-slate-500 group-hover:text-slate-800'}"></i>
            <span class="font-extrabold text-xs tracking-wider uppercase">${p.sigla}</span>
            <span class="hidden md:group-hover:block absolute left-full ml-3 px-2.5 py-1 rounded-lg bg-slate-900 text-white text-xs font-semibold whitespace-nowrap shadow-lg z-50 pointer-events-none">
              ${escapeHtml(p.nome)}
            </span>
          </button>
        `;
      }).join('');
    }

    function renderPropostaAtiva() {

      if (!container) return;

            <li class="flex items-start gap-2.5">
              <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-600 shrink-0 mt-0.5"></i>
              <span>${escapeHtml(imp)}</span>
            </li>
          `).join('')}
        </ul>
      ` : `
        <div class="p-4 rounded-xl bg-slate-50 border border-slate-200 text-xs text-slate-500 italic">
          Ainda não realizamos a reunião com esta empresa. As impressões serão adicionadas após o encontro com a comissão e formandos.
        </div>
      `;

      // 2. Comentários
      const comentariosHtml = p.comentarios.length > 0 ? `
        <ul class="space-y-2.5 text-xs sm:text-sm text-slate-700">
          ${p.comentarios.map(com => `
            <li class="flex items-start gap-2.5">
              <i data-lucide="info" class="w-4 h-4 text-amber-600 shrink-0 mt-0.5"></i>
              <span>${escapeHtml(com)}</span>
            </li>
          `).join('')}
        </ul>
      ` : `
        <div class="p-4 rounded-xl bg-slate-50 border border-slate-200 text-xs text-slate-500 italic">
          Nenhuma observação ou ponto de atenção registrado até o momento.
        </div>
      `;

      // Botão extra de fotos temáticas (caso Inspirar)
      let botaoExtraHtml = '';
      if (p.propostaExtraBtn) {
        botaoExtraHtml = `
          <div class="p-4 rounded-2xl bg-amber-50 border border-amber-300/80 text-amber-950 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div class="flex items-start gap-3">
              <div class="w-8 h-8 rounded-lg bg-amber-500 text-white flex items-center justify-center shrink-0 mt-0.5">
                <i data-lucide="hard-hat" class="w-4 h-4"></i>
              </div>
              <div>
                <strong class="text-xs sm:text-sm font-bold block">${escapeHtml(p.propostaExtraBtn.titulo)}</strong>
                <p class="text-xs text-amber-900 mt-0.5">${escapeHtml(p.propostaExtraBtn.texto)}</p>
              </div>
            </div>
            <button onclick="alert('ℹ A equipe da Inspirar está finalizando o roteiro técnico e valores das fotos em obras. Assim que enviarem, o PDF estará disponível aqui!')" class="px-3.5 py-2 rounded-xl bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold text-xs shrink-0 transition-colors">
              Consultar Status
            </button>
          </div>
        `;
      }

      // 3. Fotos & Amostras (Masonry: sem espaço em branco sobrando)
      const fotosHtml = p.fotos.length > 0 ? `
        <div class="columns-1 sm:columns-2 lg:columns-3 gap-3.5 space-y-3.5">
          ${p.fotos.map(foto => `
            <div class="break-inside-avoid overflow-hidden rounded-xl border border-slate-200 bg-white shadow-2xs">
              <img 
                src="${foto.url}" 
                alt="${escapeHtml(foto.legenda || p.nome)}" 
                class="w-full h-auto object-cover block hover:scale-102 transition-transform duration-300"
                loading="lazy"
              >
              ${foto.legenda && foto.legenda.trim() !== '' ? `
                <div class="p-2.5 text-xs font-semibold text-slate-700 border-t border-slate-100 bg-white">
                  ${escapeHtml(foto.legenda)}
                </div>
              ` : ''}
            </div>
          `).join('')}
        </div>
      ` : `
        <div class="p-6 rounded-xl bg-slate-50 border border-slate-200 text-center">
          <i data-lucide="image" class="w-7 h-7 text-slate-300 mx-auto mb-1.5"></i>
          <p class="text-xs text-slate-500">Nenhuma foto adicionada para esta empresa até o momento.</p>
        </div>
      `;

      // 4. PDFs com altura ampliada (ótima leitura no desktop e celular)
      let pdfHtml = '';
      if (p.pdfsMultiplos && p.pdfsMultiplos.length > 0) {
        pdfHtml = `
          <div class="space-y-6">
            ${p.pdfsMultiplos.map(item => `
              <div class="border border-slate-200 rounded-2xl overflow-hidden bg-white shadow-xs">
                <div class="p-3.5 bg-slate-50 border-b border-slate-200 flex items-center justify-between">
                  <span class="font-bold text-xs sm:text-sm text-slate-800 flex items-center gap-2">
                    <i data-lucide="file-text" class="w-4 h-4 text-emerald-600"></i>
                    ${escapeHtml(item.titulo)}
                  </span>
                  <a href="${item.downloadUrl}" target="_blank" rel="noopener noreferrer" class="text-xs text-emerald-700 hover:underline font-bold flex items-center gap-1">
                    Abrir no Drive <i data-lucide="external-link" class="w-3 h-3"></i>
                  </a>
                </div>
                <!-- Altura ampliada de 500px no mobile para 800px no desktop -->
                <div class="w-full h-[520px] sm:h-[800px] bg-slate-100">
                  <iframe src="${item.embedUrl}" class="w-full h-full border-0" frameborder="0"></iframe>
                </div>
              </div>
            `).join('')}
          </div>
        `;
      } else if (p.pdfUrl) {
        pdfHtml = `
          <div class="space-y-3">
            <div class="flex items-center justify-between">
              <span class="text-xs text-slate-500 font-medium">Visualizador interativo do documento:</span>
              <a href="${p.pdfDownload}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-emerald-50 text-emerald-800 text-xs font-bold border border-emerald-200 hover:bg-emerald-100 transition-colors">
                <i data-lucide="external-link" class="w-3.5 h-3.5"></i> Abrir no Google Drive
              </a>
            </div>
            <!-- Altura ampliada de 520px no mobile para 800px no desktop -->
            <div class="rounded-2xl overflow-hidden border border-slate-200 w-full h-[520px] sm:h-[800px] bg-slate-100 shadow-xs">
              <iframe src="${p.pdfUrl}" class="w-full h-full border-0" frameborder="0"></iframe>
            </div>
          </div>
        `;
      } else if (p.pdfDownload) {
        pdfHtml = `
          <div class="p-4 sm:p-5 rounded-xl bg-emerald-50/50 border border-emerald-200 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div class="flex items-start gap-3">
              <div class="w-9 h-9 rounded-lg bg-emerald-600 text-white flex items-center justify-center shrink-0 mt-0.5">
                <i data-lucide="folder-archive" class="w-5 h-5"></i>
              </div>
              <div>
                <strong class="font-bold text-slate-900 text-sm block">Documentos & Minutas no Drive Oficial</strong>
                <p class="text-xs text-slate-600 mt-0.5">Os arquivos desta empresa estão salvos na pasta geral da Colação.</p>
              </div>
            </div>
            <a href="${p.pdfDownload}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold transition-all shrink-0 shadow-xs">
              <i data-lucide="external-link" class="w-4 h-4"></i>
              <span>Acessar Pasta</span>
            </a>
          </div>
        `;
      } else {
        pdfHtml = `
          <div class="p-6 rounded-xl bg-slate-50 border border-slate-200 text-center">
            <i data-lucide="file-x" class="w-7 h-7 text-slate-300 mx-auto mb-1.5"></i>
            <p class="text-xs text-slate-500">Nenhuma proposta formal em PDF foi enviada por este fornecedor até o momento.</p>
          </div>
        `;
      }

      container.innerHTML = `
        <!-- Cabeçalho -->
        <div class="bg-white rounded-2xl border border-slate-200 p-4 sm:p-6 shadow-xs flex flex-col sm:flex-row sm:items-center justify-between gap-4">
          <div>
            <div class="flex flex-wrap items-center gap-2 mb-1.5">
              <span class="px-2.5 py-0.5 rounded-full text-xs font-extrabold bg-univasf-100 text-univasf-800">${escapeHtml(p.segmento)}</span>
              <span class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-slate-100 text-slate-700">Status: ${escapeHtml(p.statusReuniao)}</span>
            </div>
            <h1 class="text-xl sm:text-2xl lg:text-3xl font-black text-slate-900 tracking-tight flex items-center gap-2">
              <span>${escapeHtml(p.nome)}</span>
              <span class="text-xs font-black px-2 py-0.5 rounded bg-slate-200 text-slate-700">[${p.sigla}]</span>
            </h1>
            <p class="text-xs text-slate-500 mt-1">Data da Reunião com a Turma: <strong>${escapeHtml(p.dataReuniao)}</strong></p>
          </div>
        </div>

        ${botaoExtraHtml}

        <!-- 1. Impressões -->
        <div class="bg-white rounded-2xl border border-slate-200 p-4 sm:p-5 shadow-xs">
          <div class="flex items-center gap-2.5 mb-3 pb-2.5 border-b border-slate-100">
            <div class="w-7 h-7 rounded-lg bg-sky-100 text-sky-700 flex items-center justify-center">
              <i data-lucide="users" class="w-4 h-4"></i>
            </div>
            <h2 class="font-extrabold text-slate-900 text-sm sm:text-base">1. Impressões Obtidas na Reunião</h2>
          </div>
          ${impressoesHtml}
        </div>

        <!-- 2. Comentários -->
        <div class="bg-white rounded-2xl border border-slate-200 p-4 sm:p-5 shadow-xs">
          <div class="flex items-center gap-2.5 mb-3 pb-2.5 border-b border-slate-100">
            <div class="w-7 h-7 rounded-lg bg-amber-100 text-amber-800 flex items-center justify-center">
              <i data-lucide="message-square" class="w-4 h-4"></i>
            </div>
            <h2 class="font-extrabold text-slate-900 text-sm sm:text-base">2. Comentários e Pontos de Atenção</h2>
          </div>
          ${comentariosHtml}
        </div>

        <!-- 3. Fotos -->
        <div class="bg-white rounded-2xl border border-slate-200 p-4 sm:p-5 shadow-xs">
          <div class="flex items-center gap-2.5 mb-3 pb-2.5 border-b border-slate-100">
            <div class="w-7 h-7 rounded-lg bg-purple-100 text-purple-700 flex items-center justify-center">
              <i data-lucide="camera" class="w-4 h-4"></i>
            </div>
            <h2 class="font-extrabold text-slate-900 text-sm sm:text-base">3. Fotos e Amostras de Trabalhos</h2>
          </div>
          ${fotosHtml}
        </div>

        <!-- 4. PDF -->
        <div class="bg-white rounded-2xl border border-slate-200 p-4 sm:p-5 shadow-xs">
          <div class="flex items-center gap-2.5 mb-3 pb-2.5 border-b border-slate-100">
            <div class="w-7 h-7 rounded-lg bg-emerald-100 text-emerald-800 flex items-center justify-center">
              <i data-lucide="file-text" class="w-4 h-4"></i>
            </div>
            <h2 class="font-extrabold text-slate-900 text-sm sm:text-base">4. PDF com a Proposta Oficial</h2>
          </div>
          ${pdfHtml}
        </div>
      `;

      lucide.createIcons();
    }

    function escapeHtml(str) {
      return (str || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[m]);
    }
  </script>
</body>
</html>
